name: S3 Compat

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [minio, seaweedfs, rustfs, localstack, liteio]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate TLS certs
        run: bash scripts/gen-certs.sh

      - name: Start ${{ matrix.target }}
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f docker/${{ matrix.target }}/docker-compose.yml pull && break
            [ "$i" = "5" ] && { echo "All pull attempts failed." >&2; exit 1; }
            echo "Pull attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker compose -f docker/${{ matrix.target }}/docker-compose.yml up -d

      - name: Wait for ${{ matrix.target }} to be healthy
        env:
          S3COMPAT_TARGET: ${{ matrix.target }}
        run: |
          cp configs/targets.example.yml configs/targets.yml
          WAIT_TIMEOUT=90 bash scripts/wait-healthy.sh

      - name: Run tests
        env:
          S3COMPAT_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          go test ./... -v -timeout 300s -json | tee results-${{ matrix.target }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: results-${{ matrix.target }}.json

  test-garage:
    name: test (garage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start garage
        run: docker compose -f docker/garage/docker-compose.yml up -d

      - name: Wait for garage admin API
        run: |
          for i in $(seq 1 40); do
            # Accept any HTTP response (including 503 before layout is assigned).
            if curl -so /dev/null http://localhost:3903/health; then
              echo "Garage admin API is reachable."
              exit 0
            fi
            sleep 3
          done
          echo "Garage did not become reachable in time." >&2
          docker compose -f docker/garage/docker-compose.yml logs
          exit 1

      - name: Initialize garage
        run: bash scripts/init-garage.sh

      - name: Run tests
        env:
          S3COMPAT_TARGET: garage
          S3COMPAT_ACCESS_KEY_FILE: /tmp/garage-key-id
          S3COMPAT_SECRET_KEY_FILE: /tmp/garage-key-secret
        run: |
          cp configs/targets.example.yml configs/targets.yml
          set -o pipefail
          KEY_ID=$(cat /tmp/garage-key-id)
          KEY_SECRET=$(cat /tmp/garage-key-secret)
          S3COMPAT_TARGET=garage \
          S3COMPAT_ACCESS_KEY="$KEY_ID" \
          S3COMPAT_SECRET_KEY="$KEY_SECRET" \
          go test ./... -v -timeout 300s -json | tee results-garage.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-garage
          path: results-garage.json

  test-ceph:
    name: test (ceph)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start ceph
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f docker/ceph/docker-compose.yml pull && break
            [ "$i" = "5" ] && { echo "All pull attempts failed." >&2; exit 1; }
            echo "Pull attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker compose -f docker/ceph/docker-compose.yml up -d
          # Race to patch /etc/ceph/ceph.conf inside the container before OSD creates
          # pools. The demo script generates this file within the first few seconds;
          # we poll every 0.5 s and patch as soon as it appears.
          CNAME=""
          for i in $(seq 1 20); do
            CNAME=$(docker compose -f docker/ceph/docker-compose.yml ps -q ceph 2>/dev/null)
            [ -n "$CNAME" ] && break
            sleep 1
          done
          if [ -n "$CNAME" ]; then
            for i in $(seq 1 40); do
              if docker exec "$CNAME" test -f /etc/ceph/ceph.conf 2>/dev/null; then
                docker exec "$CNAME" sed -i \
                  's/osd pool default size = [0-9]*/osd pool default size = 1/' \
                  /etc/ceph/ceph.conf 2>/dev/null || true
                docker exec "$CNAME" bash -c \
                  "grep -q 'osd_pool_default_min_size\|osd pool default min_size' /etc/ceph/ceph.conf \
                   || echo 'osd_pool_default_min_size = 1' >> /etc/ceph/ceph.conf" \
                  2>/dev/null || true
                echo "Patched /etc/ceph/ceph.conf: osd_pool_default_size=1"
                docker exec "$CNAME" cat /etc/ceph/ceph.conf 2>/dev/null || true
                break
              fi
              sleep 0.5
            done
          fi

      - name: Wait for Ceph RGW
        run: |
          # Get container ID.
          CNAME=""
          for i in $(seq 1 30); do
            CNAME=$(docker compose -f docker/ceph/docker-compose.yml ps -q ceph 2>/dev/null)
            [ -n "$CNAME" ] && break
            sleep 2
          done
          echo "Container: $CNAME"

          # Step 1: set pool defaults in the config DB as early as possible.
          for i in $(seq 1 30); do
            if docker exec "$CNAME" ceph mon dump >/dev/null 2>&1; then
              docker exec "$CNAME" ceph config set global osd_pool_default_min_size 1 2>/dev/null || true
              docker exec "$CNAME" ceph config set global osd_pool_default_size 1 2>/dev/null || true
              echo "Cluster pool defaults set."
              break
            fi
            sleep 2
          done

          # Step 2: run pool resizer INSIDE the container so ceph commands have
          # direct keyring access and no docker-exec overhead from the host.
          # Set min_size before size (Ceph requires size >= min_size).
          docker exec -d "$CNAME" bash -c '
            while true; do
              for pool in $(ceph osd pool ls 2>/dev/null); do
                ceph osd pool set "$pool" min_size 1 --yes-i-really-mean-it 2>/dev/null || true
                ceph osd pool set "$pool" size 1 --yes-i-really-mean-it 2>/dev/null || true
              done
              sleep 3
            done
          '
          echo "Pool resizer running inside container."

          # Step 3: wait for demo to create the S3 user.
          for i in $(seq 1 60); do
            docker exec "$CNAME" radosgw-admin user info --uid=s3test >/dev/null 2>&1 \
              && { echo "S3 user exists — demo complete."; break; }
            [ "$i" = "60" ] && { echo "Demo timed out." >&2; docker compose -f docker/ceph/docker-compose.yml logs; exit 1; }
            sleep 5
          done

          # Step 4: wait for HEALTH_OK, or at least no unknown/peering PGs.
          for i in $(seq 1 90); do
            health=$(docker exec "$CNAME" ceph health 2>/dev/null)
            echo "Health[$i]: $health"
            if echo "$health" | grep -q "^HEALTH_OK$"; then
              echo "Cluster HEALTH_OK."
              break
            fi
            if [ "$i" -ge 60 ]; then
              pg_stat=$(docker exec "$CNAME" ceph pg stat 2>/dev/null)
              if ! echo "$pg_stat" | grep -qE "unknown|creating|peering"; then
                echo "No unknown/creating/peering PGs — proceeding despite HEALTH_WARN."
                break
              fi
            fi
            sleep 3
          done

          # Step 5: recreate the S3 user so it lands in fully-sized pools.
          docker exec "$CNAME" radosgw-admin user rm --uid=s3test 2>/dev/null || true
          docker exec "$CNAME" radosgw-admin user create \
            --uid=s3test --display-name="S3Test" \
            --access-key=cephtest --secret-key=cephtestsecret \
          && echo "S3 user recreated." || { echo "User create failed." >&2; exit 1; }

          # Step 6: verify S3 via Python boto3 (aws-cli s3 ls has a NoneType bug
          # with Ceph RGW on ubuntu-24.04).
          pip3 install boto3 -q 2>/dev/null || true
          for i in $(seq 1 30); do
            if python3 - <<'PYEOF' 2>&1; then
import sys, boto3, botocore.exceptions
s3 = boto3.client(
    's3', endpoint_url='http://localhost:7480',
    aws_access_key_id='cephtest', aws_secret_access_key='cephtestsecret',
    region_name='us-east-1')
try:
    r = s3.list_buckets()
    print('ListBuckets OK, buckets:', r.get('Buckets', []))
    sys.exit(0)
except botocore.exceptions.ClientError as e:
    print('ClientError:', e, file=sys.stderr)
    sys.exit(1)
PYEOF
              echo "Ceph RGW S3 operational."
              exit 0
            fi
            sleep 3
          done
          echo "Ceph RGW S3 did not become operational." >&2
          docker exec "$CNAME" ceph health detail 2>/dev/null || true
          docker compose -f docker/ceph/docker-compose.yml logs
          exit 1

      - name: Run tests
        env:
          S3COMPAT_TARGET: ceph
        run: |
          cp configs/targets.example.yml configs/targets.yml
          set -o pipefail
          go test ./... -v -timeout 300s -json | tee results-ceph.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ceph
          path: results-ceph.json

  matrix:
    name: Generate compat matrix
    needs: [test, test-garage, test-ceph]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true

      - name: Generate matrix
        run: go run ./scripts/gen-matrix results-*.json > COMPAT.md

      - uses: actions/upload-artifact@v4
        with:
          name: COMPAT.md
          path: COMPAT.md

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          go-version-file: go.mod
