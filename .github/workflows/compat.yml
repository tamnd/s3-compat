name: S3 Compat

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [minio, seaweedfs, rustfs, localstack, liteio]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate TLS certs
        run: bash scripts/gen-certs.sh

      - name: Start ${{ matrix.target }}
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f docker/${{ matrix.target }}/docker-compose.yml pull && break
            [ "$i" = "5" ] && { echo "All pull attempts failed." >&2; exit 1; }
            echo "Pull attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker compose -f docker/${{ matrix.target }}/docker-compose.yml up -d

      - name: Wait for ${{ matrix.target }} to be healthy
        env:
          S3COMPAT_TARGET: ${{ matrix.target }}
        run: |
          cp configs/targets.example.yml configs/targets.yml
          WAIT_TIMEOUT=90 bash scripts/wait-healthy.sh

      - name: Run tests
        env:
          S3COMPAT_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          go test ./... -v -timeout 300s -json | tee results-${{ matrix.target }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: results-${{ matrix.target }}.json

  test-garage:
    name: test (garage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start garage
        run: docker compose -f docker/garage/docker-compose.yml up -d

      - name: Wait for garage admin API
        run: |
          for i in $(seq 1 40); do
            # Accept any HTTP response (including 503 before layout is assigned).
            if curl -so /dev/null http://localhost:3903/health; then
              echo "Garage admin API is reachable."
              exit 0
            fi
            sleep 3
          done
          echo "Garage did not become reachable in time." >&2
          docker compose -f docker/garage/docker-compose.yml logs
          exit 1

      - name: Initialize garage
        run: bash scripts/init-garage.sh

      - name: Run tests
        env:
          S3COMPAT_TARGET: garage
          S3COMPAT_ACCESS_KEY_FILE: /tmp/garage-key-id
          S3COMPAT_SECRET_KEY_FILE: /tmp/garage-key-secret
        run: |
          cp configs/targets.example.yml configs/targets.yml
          set -o pipefail
          KEY_ID=$(cat /tmp/garage-key-id)
          KEY_SECRET=$(cat /tmp/garage-key-secret)
          S3COMPAT_TARGET=garage \
          S3COMPAT_ACCESS_KEY="$KEY_ID" \
          S3COMPAT_SECRET_KEY="$KEY_SECRET" \
          go test ./... -v -timeout 300s -json | tee results-garage.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-garage
          path: results-garage.json

  test-ceph:
    name: test (ceph)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start ceph
        run: |
          for i in 1 2 3 4 5; do
            docker compose -f docker/ceph/docker-compose.yml pull && break
            [ "$i" = "5" ] && { echo "All pull attempts failed." >&2; exit 1; }
            echo "Pull attempt $i failed, retrying in 30s..."
            sleep 30
          done
          docker compose -f docker/ceph/docker-compose.yml up -d

      - name: Wait for Ceph RGW
        run: |
          CNAME=$(docker compose -f docker/ceph/docker-compose.yml ps -q ceph)
          # Step 1: set pool defaults in the config DB as soon as the monitor is up,
          # before OSD / RGW create any pools.
          for i in $(seq 1 30); do
            if docker exec "$CNAME" ceph mon dump >/dev/null 2>&1; then
              docker exec "$CNAME" ceph config set global osd_pool_default_min_size 1 2>/dev/null || true
              docker exec "$CNAME" ceph config set global osd_pool_default_size 1 2>/dev/null || true
              echo "Cluster pool defaults set to size=1."
              break
            fi
            sleep 2
          done
          # Step 2: wait for the demo script to finish (S3 user created = SUCCESS line).
          for i in $(seq 1 60); do
            if docker compose -f docker/ceph/docker-compose.yml logs ceph 2>/dev/null | grep -q "SUCCESS"; then
              echo "Ceph demo script completed."
              break
            fi
            [ "$i" = "60" ] && { echo "Ceph demo did not complete in time." >&2; docker compose -f docker/ceph/docker-compose.yml logs; exit 1; }
            sleep 5
          done
          # Step 3: resize all pools created before the config DB change took effect.
          # Repeat in a short loop to also catch pools RGW creates lazily post-SUCCESS.
          for i in $(seq 1 30); do
            for pool in $(docker exec "$CNAME" ceph osd pool ls 2>/dev/null); do
              docker exec "$CNAME" ceph osd pool set "$pool" size 1 --yes-i-really-mean-it 2>/dev/null || true
              docker exec "$CNAME" ceph osd pool set "$pool" min_size 1 2>/dev/null || true
            done
            docker exec "$CNAME" ceph health 2>/dev/null | grep -q "^HEALTH_OK$" && { echo "Ceph cluster HEALTH_OK."; break; }
            sleep 3
          done
          # Step 4: recreate the S3 user so it is written into the now-stable pools.
          # The user may have been created while pools were degraded; a fresh write
          # ensures RGW can read the user metadata reliably.
          docker exec "$CNAME" radosgw-admin user rm --uid=s3test 2>/dev/null || true
          docker exec "$CNAME" radosgw-admin user create \
            --uid=s3test \
            --display-name="S3Test" \
            --access-key=cephtest \
            --secret-key=cephtestsecret 2>/dev/null \
          && echo "S3 user recreated." || echo "WARNING: user creation failed, proceeding."
          # Step 5: verify S3 is actually operational with ListBuckets before handing off.
          for i in $(seq 1 30); do
            if AWS_DEFAULT_REGION=us-east-1 \
               AWS_ACCESS_KEY_ID=cephtest \
               AWS_SECRET_ACCESS_KEY=cephtestsecret \
               aws --endpoint-url http://localhost:7480 s3 ls 2>/dev/null; then
              echo "Ceph RGW S3 is operational."
              exit 0
            fi
            sleep 3
          done
          echo "Ceph RGW S3 did not become operational in time." >&2
          docker exec "$CNAME" ceph health 2>/dev/null || true
          docker compose -f docker/ceph/docker-compose.yml logs
          exit 1

      - name: Run tests
        env:
          S3COMPAT_TARGET: ceph
        run: |
          cp configs/targets.example.yml configs/targets.yml
          set -o pipefail
          go test ./... -v -timeout 300s -json | tee results-ceph.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ceph
          path: results-ceph.json

  matrix:
    name: Generate compat matrix
    needs: [test, test-garage, test-ceph]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true

      - name: Generate matrix
        run: go run ./scripts/gen-matrix results-*.json > COMPAT.md

      - uses: actions/upload-artifact@v4
        with:
          name: COMPAT.md
          path: COMPAT.md

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          go-version-file: go.mod
