version: "3.9"

networks:
  s3net:
    driver: bridge

volumes:
  minio-data:

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ../../certs/server.crt:/root/.minio/certs/public.crt:ro
      - ../../certs/server.key:/root/.minio/certs/private.key:ro
    networks:
      - s3net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - s3net
    entrypoint: >
      /bin/sh -c "
        mc alias set local https://minio:9000 minioadmin minioadmin --insecure &&
        mc mb --ignore-existing local/test-bucket --insecure
      "
