version: "3.9"

networks:
  s3net:
    driver: bridge

volumes:
  garage-meta:
  garage-data:

services:
  garage:
    image: dxflrs/garage:v2.3.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - s3net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3903/health"]
      interval: 5s
      timeout: 5s
      retries: 15
