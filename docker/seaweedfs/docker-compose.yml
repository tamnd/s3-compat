version: "3.9"

networks:
  s3net:
    driver: bridge

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-data:

services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:4.32
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs-master-data:/data
    networks:
      - s3net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.32
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -dir=/data
    ports:
      - "8080:8080"
    volumes:
      - seaweedfs-volume-data:/data
    networks:
      - s3net
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.32
    command: filer -master=seaweedfs-master:9333 -port=8888
    ports:
      - "8888:8888"
    networks:
      - s3net
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.32
    command: s3 -filer=seaweedfs-filer:8888 -port=8333
    ports:
      - "8333:8333"
    networks:
      - s3net
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 10
