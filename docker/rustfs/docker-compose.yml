version: "3.9"

networks:
  s3net:
    driver: bridge

volumes:
  rustfs-data:

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.7
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    volumes:
      - rustfs-data:/data
    networks:
      - s3net
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
