version: "3.9"

networks:
  s3net:
    driver: bridge

volumes:
  liteio-data:

services:
  # Pass certs via LITEIO_TLS_CERT / LITEIO_TLS_KEY.
  # The image is built from the public liteio repo at build time.
  liteio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9200:9000"
      - "9201:9001"
    environment:
      LITEIO_ACCESS_KEY: liteio
      LITEIO_SECRET_KEY: liteiosecret
      LITEIO_TLS_CERT: /certs/server.crt
      LITEIO_TLS_KEY: /certs/server.key
    volumes:
      - liteio-data:/data
      - ../../certs:/certs:ro
    networks:
      - s3net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
