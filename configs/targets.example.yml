defaults:
  region: us-east-1
  use_path_style: true
  bucket_prefix: s3compat-
  ca_cert: certs/ca.crt

targets:
  aws:
    endpoint: ""
    access_key: ${AWS_ACCESS_KEY_ID}
    secret_key: ${AWS_SECRET_ACCESS_KEY}
    region: us-east-1
    use_path_style: false
    features:
      versioning: true
      object_lock: true
      lifecycle: true
      cors: true
      acl: true
      policy: true
      notifications: true
      encryption_sse_s3: true
      encryption_sse_kms: true
      encryption_sse_c: true
      replication: true
      select: true
      tagging: true
      multipart: true

  minio:
    endpoint: https://localhost:9000
    access_key: minioadmin
    secret_key: minioadmin
    region: us-east-1
    use_path_style: true
