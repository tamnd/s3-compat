      object_lock: true
      lifecycle: true
      cors: false
      acl: false
      policy: true
      notifications: false
      encryption_sse_s3: false
      encryption_sse_kms: false
      encryption_sse_c: true
      replication: false
      select: true
      tagging: true
      multipart: true

